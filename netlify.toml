[build]
  command = "vite build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY"


[functions]
  directory = "netlify/api-functions"
  node_bundler = "esbuild"

[functions."compare-quotes"]
  timeout = 120

[functions."extract-policy"]
  timeout = 120

[functions."expense-capture"]
  timeout = 120

[functions."expense-extract"]
  timeout = 120

[functions."marketing-send"]
  timeout = 120

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# ---------------------------------------------------------------------------
# MillionGuard — the single client portal (businesses and individuals).
# The old portal paths (B2B /dashboard…, B2C /one/*) lead to the unified
# /portal screens on the client domains only; the admin site is untouched.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://millionguard.com/one/*"
  to = "/portal"
  status = 301
  force = true

